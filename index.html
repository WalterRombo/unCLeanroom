<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(un)Cleanroom?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="landing">
  <h1>(un)Cleanroom?</h1>
  <p class="prompt">Upload results CSV for analysis</p>

  <label class="dish" id="dish" tabindex="0">
    <input type="file" id="file" accept=".csv,text/csv">
    <span class="dish-text" id="dishText">Drag a CSV here<br><small>or click to browse</small></span>
  </label>

  <button id="go" type="button" disabled>Analysis</button>
  <p id="err" class="err" role="alert" hidden></p>
  <p class="fine">Analysis runs entirely in your browser. No data is uploaded.</p>
</main>

<main id="results" hidden>
  <header class="bar">
    <h2>(un)Cleanroom?</h2>
    <span id="resMeta"></span>
    <button id="again" type="button" class="ghost">Analyse another file</button>
  </header>

  <section id="stats" class="stats" aria-label="Summary"></section>

  <section class="mapwrap">
    <canvas id="map" aria-label="Floor plan heat map of alert and action level excursions"></canvas>
    <div class="dl">
      <button id="dlPng" type="button">Download PNG</button>
      <button id="dlJpg" type="button" class="ghost">Download JPEG</button>
    </div>
  </section>

  <section id="notices"></section>
  <section id="tables" class="tables"></section>
</main>

<p id="loadErr" class="err" hidden></p>
<script src="js/locations.js" onerror="window.__missing=(window.__missing||[]).concat('js/locations.js')"></script>
<script src="js/floorplan.js" onerror="window.__missing=(window.__missing||[]).concat('js/floorplan.js')"></script>
<script src="js/app.js" onerror="window.__missing=(window.__missing||[]).concat('js/app.js')"></script>
<script>
window.addEventListener('load',function(){
  if(window.UC&&window.LOCATIONS&&window.FLOORPLAN)return;
  var m=(window.__missing||[]).join(', ');
  var e=document.getElementById('loadErr');
  e.textContent='The app could not start'+(m?': missing file(s) '+m+'. ':'. ')+'Keep the js, css, assets folders alongside index.html (or use uncleanroom_standalone.html), then reload. Press F12 and open Console for details.';
  e.hidden=false;e.style.cssText='position:fixed;left:0;right:0;bottom:0;margin:0;padding:1rem;background:#fff4d6;z-index:9';
});
</script>
</body>
</html>
